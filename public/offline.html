<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Renta-PH</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      /* Self-contained: the offline page is served from the SW cache, so it
         cannot rely on the app's CSS bundle or web fonts. */
      :root {
        color-scheme: light dark;
        --bg: #f7fdfb;
        --fg: #14312a;
        --muted: #4c6b62;
        --card: #ffffff;
        --border: #d8e8e2;
        --primary: #065f46;
        --primary-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1a16;
          --fg: #eaf5f1;
          --muted: #9dbcb2;
          --card: #122420;
          --border: #1f3830;
          --primary: #34d399;
          --primary-fg: #08251d;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px;
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      h1 {
        margin: 16px 0 6px;
        font-size: 1.25rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.925rem;
        line-height: 1.55;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: var(--primary-fg);
        font: inherit;
        font-weight: 600;
        padding: 11px 20px;
        cursor: pointer;
        min-height: 44px;
      }
      .meta {
        margin-top: 18px;
        font-size: 0.75rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>You&rsquo;re offline</h1>
      <p>
        This page needs a connection. Reconnect and try again &mdash; your data
        is safe and nothing has been lost.
      </p>
      <button type="button" onclick="window.location.reload()">
        Try again
      </button>
      <p class="meta">Renta-PH</p>
    </main>
  </body>
</html>
