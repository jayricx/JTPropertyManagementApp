<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Renta-PH">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Badge -->
  <rect width="64" height="64" rx="14" fill="url(#badge)"/>
  <!-- Roofline: a home, the thing being managed -->
  <path d="M11 29.5 L32 12 L53 29.5" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Peso sign (₱) as the body: rent, in Philippine pesos -->
  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stem -->
    <path d="M24 52 V33.5"/>
    <!-- Bowl of the P -->
    <path d="M24 33.5 H33.5 a7.25 7.25 0 0 1 0 14.5 H24"/>
    <!-- The two peso bars -->
    <path d="M24 40.5 H36.5"/>
    <path d="M24 46 H36.5"/>
  </g>
</svg>
